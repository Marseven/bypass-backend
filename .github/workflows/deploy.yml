name: Deploy API to Hostinger

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bypass_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, ctype, json, bcmath

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bypass_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  deploy:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger via rsync
        env:
          REMOTE: ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          PATH_API: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/app/imports/*' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='deploy.sh' \
            --exclude='.husky' \
            -e "ssh -p ${PORT}" \
            ./ "${REMOTE}:${PATH_API}/"

      - name: Run post-deploy commands
        env:
          REMOTE: ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          PATH_API: ${{ secrets.HOSTINGER_API_PATH }}
        run: |
          ssh -p ${PORT} ${REMOTE} "cd ${PATH_API} && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan queue:restart && echo 'API deployed at $(date)'"
